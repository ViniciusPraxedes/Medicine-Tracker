runtime: nodejs20
build:
  command: npm run build
  output: dist
run:
  command: npm start
env:
  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    secret: VITE_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_PROJECT_ID
    secret: VITE_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    secret: VITE_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    secret: VITE_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_APP_ID
    secret: VITE_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    secret: VITE_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME
  # Define the Firebase Cloud Messaging VAPID public key variable
  - variable: VITE_FIREBASE_VAPID_KEY
    # Retrieve value from Cloud Secret Manager
    secret: VITE_FIREBASE_VAPID_KEY
    # Specify secret availability phases
    availability:
      # Enable secret at build time for Vite
      - BUILD
      # Enable secret at runtime for server execution
      - RUNTIME

